<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#04193b"><meta name="description" content="CRC PLAY – oldalnézetes tömegoszlatás és lázadás szimuláció."><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"><link rel="icon" href="/icons/ikon-192.png"><title>CRC PLAY</title>
<style>
:root{color-scheme:dark;--navy:#04193b;--ink:#0a1322;--mut:#9aa8ba}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:#eef2f7;font-family:"Arial Narrow","Roboto Condensed",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.screen{display:none;height:100dvh}.screen.on{display:flex}
#home{align-items:center;justify-content:center;padding:18px;background:radial-gradient(ellipse at 50% 0,#12315f,var(--ink) 70%)}
.hw{width:min(1000px,100%);height:min(640px,94dvh);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;gap:16px}
.bd{grid-column:1/3;display:flex;align-items:center;gap:12px}.bd img{width:46px;height:46px;border-radius:10px}.bd b{font-size:22px;letter-spacing:.14em}.bd span{color:var(--mut);font-size:14px}
.pn{position:relative;overflow:hidden;text-align:left;padding:24px;background:linear-gradient(180deg,#0f2447,#08111f);border-top:6px solid var(--c);border-radius:4px}
.pn:hover{background:linear-gradient(180deg,#16356a,#0a1527)}
.pn h2{font-size:clamp(30px,5vw,56px);margin:0 0 10px;line-height:.95}.pn p{max-width:290px;color:#b9c5d6;line-height:1.45;margin:0;font:15px/1.45 system-ui,sans-serif}
.pn img{position:absolute;right:5%;bottom:0;height:76%;filter:drop-shadow(0 10px 18px #000b)}
#game{flex-direction:column}
.tb{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--navy)}
.tb .bk{background:#ffffff14;width:36px;height:36px;border-radius:4px;font-size:18px}
.tb .tm{font-size:22px;font-weight:700;min-width:62px;text-align:center}
.bars{flex:1;display:grid;gap:5px;font-size:12px;color:#c9d4e2}.bars div{display:flex;align-items:center;gap:8px}.bars em{font-style:normal;min-width:128px;white-space:nowrap}
.tr{flex:1;height:8px;background:#ffffff1a}.tr i{display:block;height:100%;transition:width .25s}
#bs{background:#7d9a55}#bc{background:#4f8fd8}#bf{background:#e0a03c}
.stg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#05080e}
canvas{width:min(100%,calc((100dvh - 168px)*1.7857));aspect-ratio:1000/560;display:block;touch-action:manipulation}
.ct{display:flex;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--navy)}
.ab{flex:1;min-width:0;position:relative;overflow:hidden;padding:13px 4px;background:#13294a;border-bottom:4px solid var(--k,#5d7596);font-weight:700;font-size:clamp(12px,2.9vw,16px)}
.ab i{position:absolute;inset:0;background:#000b;transform-origin:left;transform:scaleX(var(--p,0))}.ab b{position:relative}
#end{position:fixed;inset:0;display:none;place-items:center;background:#000c;padding:20px}#end.on{display:grid}
.rs{width:min(420px,100%);padding:26px;background:#0d1f3a;border-top:6px solid var(--k,#7d9a55)}.rs h2{margin:0 0 8px;font-size:34px}.rs p{margin:0 0 14px;color:#b9c5d6;font:15px/1.5 system-ui,sans-serif}.rs strong{font-size:26px;display:block;margin-bottom:16px}
.rs button{padding:12px 18px;background:#1b3a69;margin-right:8px;font-weight:700}
@media(max-width:700px){.hw{grid-template-columns:1fr;grid-template-rows:auto 1fr 1fr}.bd{grid-column:1}.pn img{height:88%}.bars em{min-width:104px;font-size:11px}}
</style></head><body>
<main>
<section id="home" class="screen on"><div class="hw">
<div class="bd"><img src="/icons/apple-touch-icon.png" alt=""><b>CRC PLAY</b><span>Tömegoszlatás, oldalnézetből</span></div>
<button class="pn" style="--c:#7d9a55" onclick="G.start('mh')"><h2>Oszlató<br>(MH)</h2><p>Vezényeld a szakaszt: alakzat, pajzs, könnygáz, vízágyú és a GIDRAN. Szórd szét a tömeget.</p><img src="/images/mh.png" alt=""></button>
<button class="pn" style="--c:#4f8fd8" onclick="G.start('cr')"><h2>Tüntető</h2><p>Dobálj, gyújts, építs barikádot és rohamozz, amíg a szakasz meg nem fut.</p><img src="/images/tun0.png" alt=""></button>
</div></section>
<section id="game" class="screen">
<div class="tb"><button class="bk" aria-label="Főmenü" onclick="G.home()">↩</button><div class="tm" id="tm">2:30</div><div class="bars"><div><em id="ls">Szakasz</em><span class="tr"><i id="bs"></i></span></div><div><em id="lc">Tömeg</em><span class="tr"><i id="bc"></i></span></div><div><em id="lf">Fáradtság</em><span class="tr"><i id="bf"></i></span></div></div></div>
<div class="stg"><canvas id="c" aria-label="Utcai jelenet"></canvas></div>
<div class="ct" id="ct"></div>
</section>
<div id="end"><div class="rs" id="rs"><h2 id="rt"></h2><p id="rp"></p><strong id="rv"></strong><button onclick="G.start(G.side())">Újra</button><button onclick="G.home()">Főmenü</button></div></div>
</main>
<script>
const G=(()=>{'use strict';
const $=s=>document.querySelector(s),R=(a,b)=>a+Math.random()*(b-a),cl=(n,a,b)=>Math.max(a,Math.min(b,n));

let fa=0,rs=4,rv=0,sp=0,rp=0,am={},fk=1,side,S,C,PJ,GS,FR,BR,PT,fx,adv,form,sh,wj,t,aim,aimT,cd,wat,wind,over,on,last,surge,BG,tt=0;const N0=18,N1=44,TL=180;
const sg=k=>{try{return+localStorage.getItem(k)||0}catch{return 0}},ss=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};

 [[0,170,120,230],[110,120,150,280],[250,185,110,215],[350,95,170,305],[510,160,130,240],[630,110,160,290],[780,175,100,225],[870,130,130,270]].forEach(([x,y,w,h])=>{g.fillStyle='#1d2733';g.fillRect(x,y,w,h);for(let yy=y+14;yy<y+h-30;yy+=26)for(let xx=x+10;xx<x+w-12;xx+=22){g.fillStyle=Math.random()<.22?'#d9a35f':'#0f1824';g.fillRect(xx,yy,9,13)}});
 q=g.createLinearGradient(0,400,0,H);q.addColorStop(0,'#3a3d40');q.addColorStop(1,'#16191c');g.fillStyle=q;g.fillRect(0,400,W,160);g.fillStyle='#55575a';g.fillRect(0,396,W,10);g.fillStyle='#ffffff18';for(let x=-20;x<W;x+=120)g.fillRect(x,532,70,5);

const act_=a=>a.filter(o=>o.st===0),ctr=()=>{const a=act_(C).sort((p,q)=>p.x-q.x).slice(0,14);return a.length?a.reduce((s,o)=>s+o.x,0)/a.length:fx+160};
function start(sd){side=sd;S=[];C=[];PJ=[];GS=[];FR=[];BR=[];PT=[];fx=300;adv=false;form='line';sh=0;wj={t:0,x:600};t=0;fa=0;rs=4;rv=40;sp=6;rp=22;am={gas:6,molo:5,barr:3,rock:60};aim=650;aimT=0;wat=100;wind=8;over=false;on=true;surge=0;
 cd={aiM:20,aiB:18,aiS:24,aiG:5,aiW:9,aiR:6,aiH:7};Object.keys(CD).forEach(k=>cd[k]=0);
 for(let i=0;i<N0;i++)S.push({x:190-(i/9|0)*40,y:428+(i%9)*8.5,mor:100,hp:100,v:i%3?'mh':'mhs',st:0,dn:0,sd:100,sw:0});

 $('#home').classList.remove('on');$('#game').classList.add('on');$('#end').classList.remove('on');last=performance.now()}

function thr(x,y,tx,ty,type,h0){const T=.55+Math.abs(tx-x)/850;PJ.push({x,y,h:h0,vx:(tx-x)/T,vy:(ty-y)/T,vh:(260*T*T-h0)/T,type,a:0})}

function aimX(){if(aimT>0)return aim;return side==='mh'?ctr():fx}
function act(k){if(!on||over)return;if(k==='adv'){adv=!adv;return}if(k==='form'){form=FK[(FK.indexOf(form)+1)%3];return}
 if(cd[k]>0||(k in am&&am[k]<1)||((k==='roh'||k==='shield')&&fa>90))return;const ax=aimX();
 if(k==='shield')sh=3.6;else if(k==='gas')gas(ax);else if(k==='water'){if(wat<20)return;wj.t=1.8;wj.x=ax}else if(k==='roh')roham();
 else if(k==='rock')rock(ax);else if(k==='molo')molo(ax);else if(k==='barr')barr(ax);else if(k==='surge')surge=4;cd[k]=CD[k]}
function ai(){if(side==='mh'){const f=act_(S);if(f.length){if(cd.aiM<=0&&t>18){molo(f[Math.random()*f.length|0].x);cd.aiM=R(14,22)}
  if(cd.aiB<=0&&t>16&&!BR.some(b=>b.hp>0)){barr(fx+R(130,210));cd.aiB=R(24,36)}if(cd.aiS<=0&&t>20){surge=4;cd.aiS=R(22,32)}}}
 else{adv=adv?fa<85:fa<35;const cx=ctr();if(cd.aiG<=0){gas(cx);cd.aiG=R(8,12)}if(cd.aiW<=0&&wat>40){wj.t=1.8;wj.x=cx;cd.aiW=R(10,14)}
  if(cd.aiR<=0&&fa<90&&C.some(c=>c.st===0&&c.x-fx<100)){roham();cd.aiR=12}if(cd.aiH<=0&&fa<85){sh=3.5;cd.aiH=R(9,14)}}}

 else if(p.type==='molo'){FR.push({x:p.x,y:p.y,t:7,r:58});S.forEach(s=>{if(s.st===0&&Math.abs(s.x-p.x)<40){const q=shd(s,45);s.hp-=6*q;s.mor-=8*q}})}else GS.push({x:p.x,y:p.y,t:11,r:26})}

 let lim=900;BR.forEach(b=>{if(b.hp>0)lim=Math.min(lim,b.x-50)});FR.forEach(f=>{if(f.t>0)lim=Math.min(lim,f.x-62)});
 const mv=adv&&fx<lim;fa=cl(fa+((mv?3:0)+(sh>0?7:0)-(mv||sh>0?0:5))*dt,0,100);rp-=dt;if(rp<=0){rp=22;am.gas=Math.min(6,am.gas+1);am.molo=Math.min(5,am.molo+1);if(Math.random()<.5)am.barr=Math.min(3,am.barr+1)}am.rock=Math.min(60,am.rock+3*dt);
 if(rv>0){sp-=dt;if(sp<=0){const y=424+R(0,76);C.push({x:1040,y,ly:y,mor:100,hp:100,v:Math.random()*3|0,st:0,dn:0,sp:Math.random(),tt:R(1,5)});rv--;sp=Math.max(1.6,5-t/40)*(side==='mh'?1:1.6)}}
 if(mv)fx=Math.min(lim,fx+(sh>0?9:17)*(1-fa/140)*dt);else if(fx>lim)fx=Math.max(lim,fx-30*dt);
 if(fx>=lim-6)BR.forEach(b=>{if(b.hp>0&&b.x-50<=lim+1)b.hp-=10*dt});
 S.forEach((s,i)=>{if(s.st===2){s.dn+=dt;return}if(s.st===1){s.x-=95*dt;return}const r=i%9,k=i/9|0;let tx,ty;if(s.sw>0){s.sw-=dt;if(s.sw<=0&&rs>0){rs--;s.v='mhs';s.sd=100}}

  if(c.hp<=0){c.st=2;c.dn=0}else if(c.mor<=0){c.st=1;panic(c,C)}});

 FR.forEach(f=>{f.t-=dt;[...S,...C].forEach(a=>{if(a.st<2&&Math.abs(a.x-f.x)<f.r&&Math.abs(a.y-f.y)<f.r*.6){const q=a.v==='mhs'?shd(a,20*dt):1;a.hp-=9*dt*q;a.mor-=11*dt*q}});if(Math.random()<dt*28)PT.push({x:f.x+R(-20,20),y:f.y-20,vx:wind*.6+R(-6,6),vy:-R(18,34),l:2.5,m:2.5,c:'62,64,70',r:7})});FR=FR.filter(f=>f.t>0);
 const gx=fx-190;if(wj.t>0){wj.t-=dt;wat=Math.max(0,wat-26*dt);const x0=gx+120,x1=wj.x+50;C.forEach(c=>{if(c.st<2&&c.x>x0&&c.x<x1){c.x+=150*dt*FM[form].pu;c.mor-=9*dt;c.hp-=1.2*dt}});FR.forEach(f=>{if(f.x>x0&&f.x<x1)f.t-=5*dt});BR.forEach(b=>{if(b.x>x0&&b.x<x1)b.hp-=26*dt});if(wat<=0)wj.t=0}

 S=S.filter(s=>s.x>-60&&!(s.st===2&&s.dn>4)||s.st===0&&s.x>-60);C=C.filter(c=>c.x<1060&&!(c.st===2&&c.dn>4));

function end(win,own,kills){over=true;const k='crc2-'+side,sc=win?400+Math.ceil(TL-t)*4+own*12:kills*10;if(sc>sg(k))ss(k,sc);
